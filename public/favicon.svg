<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="antigravityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#06b6d4" />
      <stop offset="30%" stopColor="#3b82f6" />
      <stop offset="65%" stopColor="#8b5cf6" />
      <stop offset="100%" stopColor="#ec4899" />
    </linearGradient>
    <linearGradient id="facetHighlight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.45" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0.05" />
    </linearGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.95" />
      <stop offset="40%" stopColor="#38bdf8" stopOpacity="0.5" />
      <stop offset="100%" stopColor="#8b5cf6" stopOpacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Hexagonal Shield with rounded corner effect -->
  <polygon points="24,2 44,12 44,36 24,46 4,36 4,12" fill="url(#antigravityGrad)" />

  <!-- Top Crystal Facet -->
  <polygon points="24,4 42,13 24,24 6,13" fill="url(#facetHighlight)" />

  <!-- Left Prism Shadow Facet -->
  <polygon points="6,15 24,24 24,43 6,34" fill="#000000" fill-opacity="0.18" />

  <!-- Right Prism Light Facet -->
  <polygon points="24,24 42,15 42,34 24,43" fill="#ffffff" fill-opacity="0.15" />

  <!-- Central Spark Glow -->
  <circle cx="24" cy="24" r="8" fill="url(#sparkGlow)" />

  <!-- Cross/Star Accent in Core -->
  <path d="M24 16 L24 32 M16 24 L32 24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
</svg>